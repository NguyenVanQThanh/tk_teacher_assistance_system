version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    restart: always
    mem_limit: 1g
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: teacher_assistance
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartlms_backend
    restart: always
    mem_limit: 1g
    # Load AI keys / storage config from backend/.env (compose `environment`
    # below still overrides individual values, e.g. DB_HOST=postgres)
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: 123456
      DB_NAME: teacher_assistance
      SECRET_KEY: dev_secret_key_jwt_token_change_in_production
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      TZ: Asia/Ho_Chi_Minh
      # marker-pdf pulls in torch (~GBs of RAM); keep it off in the 1g container
      ENABLE_MARKER_PDF: "0"
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartlms_frontend
    restart: always
    mem_limit: 1g
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
