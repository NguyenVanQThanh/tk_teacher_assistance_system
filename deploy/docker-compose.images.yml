# Production compose — IMAGE-ONLY: server KHÔNG cần source code, KHÔNG cần git clone.
#
# Khác deploy/docker-compose.prod.yml ở đúng một điểm: mọi service dùng `image:`
# (pull từ registry) thay vì `build:`. Nhờ vậy trên server chỉ cần 4 thứ:
#
#   /opt/smartlms/
#   ├── deploy/docker-compose.images.yml   # file này
#   ├── deploy/.env.prod                   # secrets (tự tạo trên server, KHÔNG commit)
#   ├── deploy/nginx/nginx.conf            # reverse proxy (chỉ khi dùng --profile proxy)
#   ├── postgres-init/01_extensions.sql    # tạo extension unaccent + vector cho volume mới
#   └── sgk_data/                          # vectors.dump + images.tar (~2.1 GB, KHÔNG có trong git)
#
# Build & push image (chạy trên máy dev hoặc CI, KHÔNG chạy trên server):
#   docker build -t ghcr.io/<owner>/smartlms-backend:<tag> ./backend
#   docker build -f deploy/docker/Dockerfile.frontend.prod \
#     --build-arg VITE_API_BASE_URL=/api \
#     -t ghcr.io/<owner>/smartlms-frontend:<tag> ./frontend
#   docker push ghcr.io/<owner>/smartlms-backend:<tag>
#   docker push ghcr.io/<owner>/smartlms-frontend:<tag>
#
# Chạy trên server (từ /opt/smartlms):
#   docker compose --project-directory . --env-file deploy/.env.prod \
#     -f deploy/docker-compose.images.yml --profile proxy pull
#   docker compose --project-directory . --env-file deploy/.env.prod \
#     -f deploy/docker-compose.images.yml --profile proxy up -d
#
# Hoặc từ máy dev:  pwsh deploy/scripts/deploy-remote.ps1 -Server <ip> -Tag <tag> -Tunnel
#
# RAM budget giữ nguyên bản prod (tổng 5.0 GB, xem deploy/README.md):
#   postgres 1.5 GB + backend 2.5 GB + frontend 0.875 GB + nginx 0.125 GB
#   (+ cloudflared 0.125 GB nếu bật --profile tunnel => 5.125 GB)

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: smartlms_postgres
    restart: unless-stopped
    mem_limit: 1536m
    env_file:
      - ./deploy/.env.prod
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Chỉ chạy khi volume còn RỖNG (lần init đầu tiên). Volume đã có dữ liệu thì
      # phải tự chạy:  CREATE EXTENSION IF NOT EXISTS unaccent;  (xem deploy/README.md)
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    # IMAGE_TAG cho phép rollback: deploy lại tag cũ mà không cần build lại.
    image: ${BACKEND_IMAGE:?set BACKEND_IMAGE in deploy/.env.prod}:${IMAGE_TAG:-latest}
    container_name: smartlms_backend
    restart: unless-stopped
    mem_limit: 2560m
    env_file:
      - ./deploy/.env.prod
    environment:
      # override giá trị theo môi trường container (còn lại đọc từ .env.prod)
      DB_HOST: postgres
      DB_PORT: "5432"
      TZ: Asia/Ho_Chi_Minh
      # marker-pdf (torch) đã bị loại khỏi requirements.txt; khoá cứng ở trạng thái tắt
      ENABLE_MARKER_PDF: "0"
      # Connection pool: 20 + 30 overflow = tối đa 50 connection vật lý/process.
      DB_POOL_SIZE: "20"
      DB_MAX_OVERFLOW: "30"
      DB_POOL_TIMEOUT: "10"
      DB_POOL_RECYCLE: "1800"
      DB_STATEMENT_TIMEOUT_MS: "30000"
      # Heavy-work guards (xem backend/app/core/resource_limits.py).
      PDF_EXPORT_CONCURRENCY: "2"
      IMPORT_CONCURRENCY: "2"
      ETL_CONCURRENCY: "1"
      MAX_INGEST_BYTES: "52428800"
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
      # SGK RAG data: put vectors.dump (+ images.tar) in ./sgk_data on the server
      - ./sgk_data:/sgk_data:ro
    # prod: không --reload. 1 worker là đủ cho 30 user (async I/O + threadpool).
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --limit-concurrency 128
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    image: ${FRONTEND_IMAGE:?set FRONTEND_IMAGE in deploy/.env.prod}:${IMAGE_TAG:-latest}
    container_name: smartlms_frontend
    restart: unless-stopped
    mem_limit: 896m
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy

  # Reverse proxy tuỳ chọn — bật bằng --profile proxy (hoặc tự bật khi dùng --profile tunnel).
  # Bind/port cấu hình qua .env.prod để không đụng nginx có sẵn trên host:
  #   NGINX_BIND=0.0.0.0  NGINX_PORT=80     -> server trống, mở thẳng ra ngoài
  #   NGINX_BIND=127.0.0.1 NGINX_PORT=8080  -> đã có nginx host / dùng cloudflared
  #                                           (host nginx hoặc tunnel trỏ vào 127.0.0.1:8080)
  nginx:
    image: nginx:alpine
    container_name: smartlms_nginx
    restart: unless-stopped
    mem_limit: 128m
    profiles: ["proxy", "tunnel", "quick"]
    ports:
      - "${NGINX_BIND:-0.0.0.0}:${NGINX_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

  # Cloudflare Tunnel: đưa web ra Internet mà KHÔNG cần mở port, KHÔNG cần port-forward
  # router, KHÔNG cần IP tĩnh, KHÔNG cần certbot (Cloudflare lo TLS ở edge).
  #
  # Bật bằng --profile tunnel (nginx tự bật theo). Trên Zero Trust dashboard, public
  # hostname trỏ vào:  http://nginx:80   (tên service trong network của compose).
  #
  # Token lấy từ Zero Trust > Networks > Tunnels > Create a tunnel > Cloudflared.
  # Dùng biến TUNNEL_TOKEN thay vì --token để token không nằm trong command line.
  # Token để trống vẫn `docker compose config` được (các profile khác không bị chặn);
  # cloudflared sẽ tự báo lỗi khi chạy nếu thiếu token.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: smartlms_cloudflared
    restart: unless-stopped
    mem_limit: 128m
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - nginx

  # Quick tunnel: 0 đồng, KHÔNG cần domain, KHÔNG cần token. Cloudflare cấp ngẫu nhiên
  # https://<random>.trycloudflare.com — đổi mỗi lần container restart, Cloudflare
  # rate-limit và không đảm bảo uptime. Chỉ để demo nhanh, KHÔNG dùng cho production.
  # Bật bằng --profile quick. Lấy URL: docker logs smartlms_cloudflared_quick
  cloudflared-quick:
    image: cloudflare/cloudflared:latest
    container_name: smartlms_cloudflared_quick
    restart: unless-stopped
    mem_limit: 128m
    profiles: ["quick"]
    command: tunnel --no-autoupdate --url http://nginx:80
    depends_on:
      - nginx

volumes:
  postgres_data:
  backend_uploads:
