# Reverse proxy cho production (service nginx, profile "proxy").
# Frontend build với VITE_API_BASE_URL=/api nên mọi call API đi qua /api/* ở đây.
#
# Ghi chú vận hành:
#  - File này được mount vào /etc/nginx/conf.d/default.conf, nên chỉ chứa
#    server block. Các directive thuộc http context (limit_req_zone,
#    proxy_cache_path...) phải khai báo trong /etc/nginx/nginx.conf.
#  - Rate limit đăng nhập đã có ở app (app/core/rate_limit.py). Nếu cần
#    rate limit ở edge, thêm limit_req_zone vào http context rồi bật
#    limit_req trong location /api/.
#  - SSE phải tắt proxy_buffering và dùng read timeout dài, nếu không
#    event sẽ bị giữ trong buffer và browser không nhận được realtime.

server {
    listen 80;
    server_name _;

    # Upload đề/ảnh có thể tới vài chục MB — cho phép tối đa 50MB
    # (khớp MAX_INGEST_BYTES mặc định của backend; multipart framing có thể
    # thêm vài KB, nâng lên 52m nếu file đúng 50.0 MB bị từ chối).
    client_max_body_size 50m;

    # Frontend prod build với VITE_API_BASE_URL=/api:
    #  - axios path /api/v1/...  -> URL /api/api/v1/...  -> rewrite về /api/v1/...
    #  - ảnh /uploads/...        -> URL /api/uploads/... -> rewrite về /uploads/...
    #  - ảnh /sgk-images/...     -> URL /api/sgk-images/... -> rewrite về /sgk-images/...
    # Nhờ vậy cả frontend (double prefix) và client gọi thẳng backend
    # (single prefix) đều đi đúng route FastAPI/StaticFiles.
    rewrite ^/api/api/(.*)$ /api/$1 last;
    rewrite ^/api/(uploads|sgk-images)/(.*)$ /$1/$2 last;

    # Nén JSON/JS/CSS để giảm băng thông cho 30 user đồng thời.
    # KHÔNG thêm text/event-stream: SSE phải stream nguyên bản, không buffer.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # SPA frontend (vite preview)
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ------------------------------------------------------------------
    # SSE: long-lived, không được buffer/cache.
    # Frontend prod build với VITE_API_BASE_URL=/api và axios path bắt đầu
    # bằng /api/v1 nên URL thực tế là /api/api/v1/...; client gọi thẳng
    # backend có thể dùng /api/v1/.... Phục vụ cả hai dạng.
    # ------------------------------------------------------------------
    location = /api/v1/sync/stream {
        proxy_pass http://backend:8000/api/v1/sync/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no always;
    }

    location = /api/api/v1/sync/stream {
        proxy_pass http://backend:8000/api/v1/sync/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no always;
    }

    # Admin monitoring SSE (nếu module monitoring bật stream endpoint).
    location = /api/v1/admin/monitoring/stream {
        proxy_pass http://backend:8000/api/v1/admin/monitoring/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no always;
    }

    location = /api/api/v1/admin/monitoring/stream {
        proxy_pass http://backend:8000/api/v1/admin/monitoring/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no always;
    }

    # API backend: sau bước rewrite ở trên, path đã là /api/v1/... đúng như
    # router FastAPI (các router đã có prefix /api/v1). Không strip thêm prefix.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Upload lớn (đề PDF/DOCX) được stream sang backend thay vì buffer
        # toàn bộ file trong Nginx.
        proxy_request_buffering off;
    }

    # File tĩnh của backend (ảnh câu hỏi / SGK) — giữ nguyên path /uploads/...
    # Trình duyệt cache 7 ngày; ảnh câu hỏi/SGK gần như bất biến theo tên file.
    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=604800, immutable" always;
    }

    location /sgk-images/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=604800, immutable" always;
    }

    # Health check của backend đi thẳng không qua /api
    location = /health {
        proxy_pass http://backend:8000/health;
        access_log off;
    }
}
