# Reverse proxy cho production (service nginx, profile "proxy").
# Frontend build với VITE_API_BASE_URL=/api nên mọi call API đi qua /api/* ở đây.

server {
    listen 80;
    server_name _;

    # Upload đề/ảnh có thể tới vài chục MB — cho phép tối đa 50MB
    client_max_body_size 50m;

    # SPA frontend (vite preview)
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API backend: strip prefix /api trước khi sang FastAPI
    # (vd: /api/auth/login -> http://backend:8000/auth/login)
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # File tĩnh của backend (ảnh câu hỏi / SGK) — giữ nguyên path /uploads/...
    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Health check của backend đi thẳng không qua /api
    location = /health {
        proxy_pass http://backend:8000/health;
    }
}
