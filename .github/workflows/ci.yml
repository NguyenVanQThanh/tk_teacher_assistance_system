# Gate for tk_teacher_assistance_system. Job name `check` must match the ruleset's required status check.
name: ci
on:
  pull_request:
  push:
    branches: [main, dev]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: backend
      # Tests use in-memory SQLite (tests/conftest.py); no DB service needed.
      - run: pytest
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # No lint/test scripts in frontend yet; build is the only gate.
      - run: npm run build
        working-directory: frontend
